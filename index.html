<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Painel Ban WhatsApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      color: #fff;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
    .login-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 400px;
      padding: 20px;
      background-color: rgba(42, 42, 42, 0.9);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
    }
    .login-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 16px;
    }
    .login-input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #3a3a3a;
      color: #fff;
    }
    .login-input::placeholder {
      color: #bbb;
    }
    .login-button {
      width: 100%;
      padding: 12px;
      background-color: #00ffcc;
      color: black;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .login-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ffee;
    }
    .scare {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: 2;
    }
    video#video {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }
    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      z-index: 1;
    }
    footer a {
      color: #00ffee;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      animation: blinkColor 4s infinite;
    }
    @keyframes blinkColor {
      0% { color: #00ffee; }
      50% { color: #00ff00; }
      100% { color: #00ffee; }
    }
    h5 {
      color: yellow;
    }
  </style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="login-container">
  <p class="login-title">H e a l k - Banned Painel</p>
  <h5>Painel de Ban Da H e a l k - Banned</h5>
  <input type="number" class="login-input" placeholder="Coloque o Número do WhatsApp" id="text">
  <button class="login-button" id="login-button"><h4>Banir</h4></button>
</div>

<div class="scare">
  <video id="video" src="404.mp4" loop></video>
</div>

<footer>
  <a href="https://wa.me/552199836277" target="_blank">By StanicDnvManoooKkkkkkj</a>
</footer>

<script>
  // Matrix effect
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;

  const letters = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");
  const fontSize = 14;
  const columns = canvas.width / fontSize;
  const drops = Array.from({ length: columns }, () => 1);

  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ffee";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      drops[i]++;
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    }
  }
  setInterval(drawMatrix, 33);

  // Botão banir vídeo
  const video = document.getElementById("video");
  const scare = document.querySelector(".scare");
  const loginButton = document.getElementById("login-button");

  loginButton.addEventListener("click", function(event) {
    event.preventDefault();
    scare.style.display = "block";
    video.play();
    videoClick();
  });

  function videoClick(event) {
    if (event) event.preventDefault();
    const { documentElement } = document;
    if (documentElement.requestFullscreen) documentElement.requestFullscreen();
    else if (documentElement.mozRequestFullScreen) documentElement.mozRequestFullScreen();
    else if (documentElement.webkitRequestFullscreen) documentElement.webkitRequestFullscreen();
    else if (documentElement.msRequestFullscreen) documentElement.msRequestFullscreen();
  }

  video.addEventListener("click", videoClick);
</script>
</body>
</html>
